basePath: /api/v1
definitions:
  templatev27_internal_http_datatransfers_requests.ChangePasswordRequest:
    properties:
      current_password:
        maxLength: 72
        minLength: 1
        type: string
      new_password:
        maxLength: 72
        minLength: 12
        type: string
    required:
    - current_password
    - new_password
    type: object
  templatev27_internal_http_datatransfers_requests.ForgotPasswordRequest:
    properties:
      email:
        maxLength: 50
        type: string
    required:
    - email
    type: object
  templatev27_internal_http_datatransfers_requests.LoginRequest:
    properties:
      email:
        maxLength: 50
        type: string
      password:
        maxLength: 72
        minLength: 1
        type: string
    required:
    - email
    - password
    type: object
  templatev27_internal_http_datatransfers_requests.RefreshRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  templatev27_internal_http_datatransfers_requests.RegisterRequest:
    properties:
      email:
        maxLength: 50
        type: string
      password:
        maxLength: 72
        minLength: 12
        type: string
      username:
        maxLength: 25
        minLength: 3
        type: string
    required:
    - email
    - password
    - username
    type: object
  templatev27_internal_http_datatransfers_requests.ResetPasswordRequest:
    properties:
      new_password:
        maxLength: 72
        minLength: 12
        type: string
      token:
        type: string
    required:
    - new_password
    - token
    type: object
  templatev27_internal_http_datatransfers_requests.SendOTPRequest:
    properties:
      email:
        maxLength: 50
        type: string
    required:
    - email
    type: object
  templatev27_internal_http_datatransfers_requests.VerifyOTPRequest:
    properties:
      code:
        type: string
      email:
        maxLength: 50
        type: string
    required:
    - code
    - email
    type: object
  templatev27_internal_http_datatransfers_responses.UserResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      refresh_token:
        type: string
      role_id:
        type: integer
      token:
        type: string
      updated_at:
        type: string
      username:
        type: string
    type: object
  templatev27_internal_http_handlers_v1.BaseResponse:
    properties:
      data: {}
      message:
        type: string
      request_id:
        type: string
      status:
        type: boolean
    type: object
host: localhost:8080
info:
  contact:
    name: Gerege Backend Template v27
    url: https://github.com/snykk/go-rest-boilerplate
  description: Fiber v3 + GORM (PostgreSQL) + Redis дээр суурилсан Clean Architecture
    бүхий Go backend. Нээлттэй эхийн snykk/go-rest-boilerplate (MIT, зохиогч Najib
    Fikri)-ээс үүсэлтэй; Gin -> Fiber v3 болон sqlx -> GORM руу хөрвүүлсэн.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: https://github.com/snykk/go-rest-boilerplate
  title: Gerege Backend Template v27 API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Access токен (богино TTL) болон refresh токен (урт TTL) буцаана.
        Хэрэглэгчийг тоолохоос сэргийлэхийн тулд буруу нууц үг болон тодорхойгүй email
        ижил хугацаа зарцуулна.
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/templatev27_internal_http_datatransfers_requests.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Tokens issued
          schema:
            allOf:
            - $ref: '#/definitions/templatev27_internal_http_handlers_v1.BaseResponse'
            - properties:
                data:
                  $ref: '#/definitions/templatev27_internal_http_datatransfers_responses.UserResponse'
              type: object
        "400":
          description: Malformed JSON body
          schema:
            $ref: '#/definitions/templatev27_internal_http_handlers_v1.BaseResponse'
        "401":
          description: Invalid email or password
          schema:
            $ref: '#/definitions/templatev27_internal_http_handlers_v1.BaseResponse'
        "403":
          description: Account not yet activated
          schema:
            $ref: '#/definitions/templatev27_internal_http_handlers_v1.BaseResponse'
        "422":
          description: Validation error
          schema:
            $ref: '#/definitions/templatev27_internal_http_handlers_v1.BaseResponse'
      summary: Баталгаажуулж токен хос олгох
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: /auth/refresh татгалзахын тулд refresh-токены jti-г Redis-ээс устгана.
        Access токенууд байгалийн хугацаа дуустлаа хүчинтэй хэвээр үлдэнэ — клиентүүд
        тэдгээрийг logout хийх үед устгах ёстой.
      parameters:
      - description: Refresh token to revoke
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/templatev27_internal_http_datatransfers_requests.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Logged out
          schema:
            $ref: '#/definitions/templatev27_internal_http_handlers_v1.BaseResponse'
        "401":
          description: Refresh token invalid
          schema:
            $ref: '#/definitions/templatev27_internal_http_handlers_v1.BaseResponse'
        "422":
          description: Validation error
          schema:
            $ref: '#/definitions/templatev27_internal_http_handlers_v1.BaseResponse'
      summary: Refresh токеныг хүчингүй болгох
      tags:
      - auth
  /auth/password/change:
    put:
      consumes:
      - application/json
      description: Одоогийн нууц үгийг шалгаж, шинээр сольж, цуцлалтын хязгаарыг тэмдэглэдэг
        тул одооноос өмнө олгогдсон refresh токенууд татгалзагдана.
      parameters:
      - description: Current + new password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/templatev27_internal_http_datatransfers_requests.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Password changed
          schema:
            $ref: '#/definitions/templatev27_internal_http_handlers_v1.BaseResponse'
        "400":
          description: Malformed JSON body
          schema:
            $ref: '#/definitions/templatev27_internal_http_handlers_v1.BaseResponse'
        "401":
          description: Current password incorrect
          schema:
            $ref: '#/definitions/templatev27_internal_http_handlers_v1.BaseResponse'
        "422":
          description: Validation error
          schema:
            $ref: '#/definitions/templatev27_internal_http_handlers_v1.BaseResponse'
      security:
      - BearerAuth: []
      summary: Баталгаажуулагдсан хэрэглэгчийн нууц үгийг солих
      tags:
      - auth
  /auth/password/forgot:
    post:
      consumes:
      - application/json
      description: Хаяг руу битүүмжилсэн сэргээх токеныг и-мэйлээр илгээнэ. Хэрэглэгчийг
        тоолохоос сэргийлэхийн тулд email бүртгэлгүй байсан ч үргэлж 200 буцаана.
      parameters:
      - description: Email address
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/templatev27_internal_http_datatransfers_requests.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Reset email queued (or email not registered — same response
            either way)
          schema:
            $ref: '#/definitions/templatev27_internal_http_handlers_v1.BaseResponse'
        "400":
          description: Malformed JSON body
          schema:
            $ref: '#/definitions/templatev27_internal_http_handlers_v1.BaseResponse'
        "422":
          description: Validation error
          schema:
            $ref: '#/definitions/templatev27_internal_http_handlers_v1.BaseResponse'
      summary: Нууц үг сэргээх токен олгох
      tags:
      - auth
  /auth/password/reset:
    post:
      consumes:
      - application/json
      description: ForgotPassword-ийн олгосон токеныг баталгаажуулж, шинэ нууц үг
        тогтоож, цуцлалтын хязгаарыг урагшлуулна.
      parameters:
      - description: Reset token + new password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/templatev27_internal_http_datatransfers_requests.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Password reset
          schema:
            $ref: '#/definitions/templatev27_internal_http_handlers_v1.BaseResponse'
        "400":
          description: Malformed JSON body
          schema:
            $ref: '#/definitions/templatev27_internal_http_handlers_v1.BaseResponse'
        "401":
          description: Reset token invalid or expired
          schema:
            $ref: '#/definitions/templatev27_internal_http_handlers_v1.BaseResponse'
        "422":
          description: Validation error
          schema:
            $ref: '#/definitions/templatev27_internal_http_handlers_v1.BaseResponse'
      summary: Сэргээх токеныг ашиглаж шинэ нууц үг тогтоох
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Өгөгдсөн refresh токеныг шалгаж, шинэ access+refresh хос үүсгэж,
        хуучин jti-г Redis-д хүчингүй болгоно. Аль хэдийн сэлгэгдсэн токеныг дахин
        тоглуулах нь 401 буцаана.
      parameters:
      - description: Refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/templatev27_internal_http_datatransfers_requests.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: New token pair
          schema:
            allOf:
            - $ref: '#/definitions/templatev27_internal_http_handlers_v1.BaseResponse'
            - properties:
                data:
                  $ref: '#/definitions/templatev27_internal_http_datatransfers_responses.UserResponse'
              type: object
        "401":
          description: Refresh token invalid, expired, or already revoked
          schema:
            $ref: '#/definitions/templatev27_internal_http_handlers_v1.BaseResponse'
        "403":
          description: Account no longer active
          schema:
            $ref: '#/definitions/templatev27_internal_http_handlers_v1.BaseResponse'
        "422":
          description: Validation error
          schema:
            $ref: '#/definitions/templatev27_internal_http_handlers_v1.BaseResponse'
      summary: Refresh токеныг сэлгэж, шинэ хос буцаах
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Хэрэглэгчийн бүртгэлийг идэвхгүй төлөвт үүсгэнэ. Дуудагч нь /auth/login
        амжилттай болохоос өмнө бүртгэлийг идэвхжүүлэхийн тулд /auth/send-otp + /auth/verify-otp-г
        дагах ёстой.
      parameters:
      - description: Registration payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/templatev27_internal_http_datatransfers_requests.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: User created
          schema:
            allOf:
            - $ref: '#/definitions/templatev27_internal_http_handlers_v1.BaseResponse'
            - properties:
                data:
                  $ref: '#/definitions/templatev27_internal_http_datatransfers_responses.UserResponse'
              type: object
        "400":
          description: Malformed JSON body
          schema:
            $ref: '#/definitions/templatev27_internal_http_handlers_v1.BaseResponse'
        "409":
          description: Email or username already in use
          schema:
            $ref: '#/definitions/templatev27_internal_http_handlers_v1.BaseResponse'
        "422":
          description: Validation error (per-field detail in data.errors)
          schema:
            $ref: '#/definitions/templatev27_internal_http_handlers_v1.BaseResponse'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/templatev27_internal_http_handlers_v1.BaseResponse'
      summary: Шинэ хэрэглэгч бүртгэх
      tags:
      - auth
  /auth/send-otp:
    post:
      consumes:
      - application/json
      description: 6 оронтой OTP үүсгэж, TTL-тэйгээр Redis-д хадгалж, async mailer-ээр
        и-мэйлийг дараалалд оруулна. HTTP хариу нь бодит SMTP хүргэлт дээр биш, дараалалд
        оруулах үед буцдаг.
      parameters:
      - description: Email to send OTP to
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/templatev27_internal_http_datatransfers_requests.SendOTPRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OTP enqueued
          schema:
            $ref: '#/definitions/templatev27_internal_http_handlers_v1.BaseResponse'
        "400":
          description: Account already activated
          schema:
            $ref: '#/definitions/templatev27_internal_http_handlers_v1.BaseResponse'
        "404":
          description: Email not registered
          schema:
            $ref: '#/definitions/templatev27_internal_http_handlers_v1.BaseResponse'
        "422":
          description: Validation error
          schema:
            $ref: '#/definitions/templatev27_internal_http_handlers_v1.BaseResponse'
        "500":
          description: Failed to enqueue mail
          schema:
            $ref: '#/definitions/templatev27_internal_http_handlers_v1.BaseResponse'
      summary: Хэрэглэгчийн email рүү OTP код илгээх
      tags:
      - auth
  /auth/verify-otp:
    post:
      consumes:
      - application/json
      description: Өгөгдсөн кодыг Redis-тэй тулгаж шалгаж, амжилттай үед хэрэглэгчийн
        active flag-г true болгоно. Brute-force-оос хамгаалагдсан — OTP_MAX_ATTEMPTS
        алдаа (өгөгдмөл 5) гарсны дараа зөв кодтой ч email нь OTP TTL цонхны турш
        түгжигдэнэ.
      parameters:
      - description: Email + OTP code
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/templatev27_internal_http_datatransfers_requests.VerifyOTPRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Account activated
          schema:
            $ref: '#/definitions/templatev27_internal_http_handlers_v1.BaseResponse'
        "400":
          description: Invalid OTP code
          schema:
            $ref: '#/definitions/templatev27_internal_http_handlers_v1.BaseResponse'
        "403":
          description: Locked out — too many invalid attempts
          schema:
            $ref: '#/definitions/templatev27_internal_http_handlers_v1.BaseResponse'
        "404":
          description: Email not registered
          schema:
            $ref: '#/definitions/templatev27_internal_http_handlers_v1.BaseResponse'
        "422":
          description: Validation error
          schema:
            $ref: '#/definitions/templatev27_internal_http_handlers_v1.BaseResponse'
      summary: OTP кодыг шалгаж бүртгэлийг идэвхжүүлэх
      tags:
      - auth
  /users/me:
    get:
      description: Authorization header дахь JWT-ээс баталгаажуулагдсан хэрэглэгчийг
        уншиж, тохирох бичлэгийг буцаана (эхлээд in-memory кэш, олдоогүй үед Postgres).
      produces:
      - application/json
      responses:
        "200":
          description: User profile
          schema:
            allOf:
            - $ref: '#/definitions/templatev27_internal_http_handlers_v1.BaseResponse'
            - properties:
                data:
                  $ref: '#/definitions/templatev27_internal_http_datatransfers_responses.UserResponse'
              type: object
        "401":
          description: Missing or invalid token
          schema:
            $ref: '#/definitions/templatev27_internal_http_handlers_v1.BaseResponse'
        "404":
          description: User no longer exists
          schema:
            $ref: '#/definitions/templatev27_internal_http_handlers_v1.BaseResponse'
      security:
      - BearerAuth: []
      summary: Одоогийн хэрэглэгчийн профайлыг буцаах
      tags:
      - users
schemes:
- http
- https
securityDefinitions:
  BearerAuth:
    description: /auth/login эсвэл /auth/refresh-аас олгогдсон Bearer хандах токен
      (access token).
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
