basePath: /api/v1
definitions:
  template_internal_http_datatransfers_requests.AIAudio:
    properties:
      data:
        maxLength: 716800
        type: string
      mime:
        enum:
        - audio/webm
        - audio/ogg
        - audio/wav
        - audio/mpeg
        - audio/mp3
        - audio/mp4
        - audio/m4a
        - audio/aac
        - audio/flac
        type: string
    required:
    - data
    - mime
    type: object
  template_internal_http_datatransfers_requests.AIChatRequest:
    properties:
      audio:
        $ref: '#/definitions/template_internal_http_datatransfers_requests.AIAudio'
      history:
        items:
          $ref: '#/definitions/template_internal_http_datatransfers_requests.AIChatTurn'
        maxItems: 20
        type: array
      message:
        maxLength: 4000
        type: string
    type: object
  template_internal_http_datatransfers_requests.AIChatTurn:
    properties:
      role:
        enum:
        - user
        - model
        type: string
      text:
        maxLength: 4000
        type: string
    required:
    - role
    - text
    type: object
  template_internal_http_datatransfers_requests.AISTTRequest:
    properties:
      audio:
        $ref: '#/definitions/template_internal_http_datatransfers_requests.AIAudio'
    required:
    - audio
    type: object
  template_internal_http_datatransfers_requests.AITTSRequest:
    properties:
      text:
        maxLength: 2000
        type: string
      voice:
        maxLength: 40
        type: string
    required:
    - text
    type: object
  template_internal_http_datatransfers_requests.AITranslateRequest:
    properties:
      audio:
        $ref: '#/definitions/template_internal_http_datatransfers_requests.AIAudio'
      speak:
        type: boolean
      target_lang:
        maxLength: 20
        minLength: 2
        type: string
      text:
        maxLength: 4000
        type: string
    required:
    - target_lang
    type: object
  template_internal_http_datatransfers_requests.ChangePasswordRequest:
    properties:
      current_password:
        maxLength: 72
        minLength: 1
        type: string
      new_password:
        maxLength: 72
        minLength: 12
        type: string
    required:
    - current_password
    - new_password
    type: object
  template_internal_http_datatransfers_requests.ForgotPasswordRequest:
    properties:
      email:
        maxLength: 50
        type: string
    required:
    - email
    type: object
  template_internal_http_datatransfers_requests.LoginRequest:
    properties:
      email:
        maxLength: 50
        type: string
      password:
        maxLength: 72
        minLength: 1
        type: string
    required:
    - email
    - password
    type: object
  template_internal_http_datatransfers_requests.LogoutRequest:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  template_internal_http_datatransfers_requests.RefreshRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  template_internal_http_datatransfers_requests.RegisterRequest:
    properties:
      email:
        maxLength: 50
        type: string
      first_name:
        description: нэр (монгол)
        maxLength: 50
        minLength: 1
        type: string
      first_name_en:
        description: нэр (англи)
        maxLength: 50
        type: string
      last_name:
        description: овог (монгол)
        maxLength: 50
        minLength: 1
        type: string
      last_name_en:
        description: овог (англи)
        maxLength: 50
        type: string
      password:
        maxLength: 72
        minLength: 12
        type: string
      username:
        maxLength: 25
        minLength: 3
        type: string
    required:
    - email
    - first_name
    - last_name
    - password
    - username
    type: object
  template_internal_http_datatransfers_requests.ResetPasswordRequest:
    properties:
      code:
        type: string
      email:
        maxLength: 50
        type: string
      new_password:
        maxLength: 72
        minLength: 12
        type: string
    required:
    - code
    - email
    - new_password
    type: object
  template_internal_http_datatransfers_requests.SendOTPRequest:
    properties:
      email:
        maxLength: 50
        type: string
    required:
    - email
    type: object
  template_internal_http_datatransfers_requests.VerifyOTPRequest:
    properties:
      code:
        type: string
      email:
        maxLength: 50
        type: string
    required:
    - code
    - email
    type: object
  template_internal_http_datatransfers_responses.AIAudioOut:
    properties:
      data:
        type: string
      mime:
        type: string
    type: object
  template_internal_http_datatransfers_responses.AIChatResponse:
    properties:
      degraded:
        type: boolean
      reply:
        type: string
      steps:
        items:
          $ref: '#/definitions/template_internal_http_datatransfers_responses.AIChatStep'
        type: array
    type: object
  template_internal_http_datatransfers_responses.AIChatStep:
    properties:
      args:
        additionalProperties: {}
        type: object
      result:
        additionalProperties: {}
        type: object
      tool:
        type: string
    type: object
  template_internal_http_datatransfers_responses.AISTTResponse:
    properties:
      text:
        type: string
    type: object
  template_internal_http_datatransfers_responses.AITranslateResponse:
    properties:
      audio:
        $ref: '#/definitions/template_internal_http_datatransfers_responses.AIAudioOut'
      source_text:
        type: string
      translated:
        type: string
    type: object
  template_internal_http_datatransfers_responses.UserResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      first_name:
        type: string
      first_name_en:
        type: string
      full_name:
        type: string
      full_name_en:
        type: string
      id:
        type: string
      last_name:
        type: string
      last_name_en:
        type: string
      refresh_token:
        type: string
      role_id:
        type: integer
      token:
        type: string
      updated_at:
        type: string
      username:
        type: string
    type: object
  template_internal_http_handlers_v1.BaseResponse:
    properties:
      data: {}
      message:
        type: string
      request_id:
        type: string
      status:
        type: boolean
    type: object
host: localhost:8080
info:
  contact:
    name: Gerege Backend Template v27
    url: https://github.com/snykk/go-rest-boilerplate
  description: chi (net/http) + pgx (PostgreSQL) + Redis дээр суурилсан Clean Architecture
    бүхий Go backend. Нээлттэй эхийн snykk/go-rest-boilerplate (MIT, зохиогч Najib
    Fikri)-ээс үүсэлтэй; HTTP давхаргыг chi, өгөгдлийн давхаргыг pgx руу хөрвүүлсэн.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: https://github.com/snykk/go-rest-boilerplate
  title: Gerege Backend Template v27 API
  version: "1.0"
paths:
  /ai/chat:
    post:
      consumes:
      - application/json
      description: Хэрэглэгчийн мессежийг (текст эсвэл audio — дуут мессежийг AI шууд
        ойлгоно) Gemini AI pipeline-аар боловсруулж Монгол хариулт буцаана. AI шаардлагатай
        үед backend tool-уудыг (function calling) ашигладаг; гүйцэтгэсэн алхмууд steps
        талбарт ил гарна. AI үйлчилгээ түр унавал degraded=true + fallback мессеж
        буцаана (5xx биш).
      parameters:
      - description: Chat message (text and/or audio) + optional history
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/template_internal_http_datatransfers_requests.AIChatRequest'
      produces:
      - application/json
      responses:
        "200":
          description: AI reply
          schema:
            allOf:
            - $ref: '#/definitions/template_internal_http_handlers_v1.BaseResponse'
            - properties:
                data:
                  $ref: '#/definitions/template_internal_http_datatransfers_responses.AIChatResponse'
              type: object
        "400":
          description: Malformed JSON body / missing message and audio
          schema:
            $ref: '#/definitions/template_internal_http_handlers_v1.BaseResponse'
        "401":
          description: Missing/invalid token
          schema:
            $ref: '#/definitions/template_internal_http_handlers_v1.BaseResponse'
        "422":
          description: Validation error
          schema:
            $ref: '#/definitions/template_internal_http_handlers_v1.BaseResponse'
        "429":
          description: Rate limit exceeded
          schema:
            $ref: '#/definitions/template_internal_http_handlers_v1.BaseResponse'
      security:
      - BearerAuth: []
      summary: AI туслахтай чатлах (текст/дуут мессеж)
      tags:
      - ai
  /ai/stt:
    post:
      consumes:
      - application/json
      description: Base64 кодлогдсон audio (webm/ogg/wav/mp3 г.м.)-г Gemini-ээр текст
        болгоно. Яриа илрээгүй бол хоосон text буцаана.
      parameters:
      - description: Audio (base64)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/template_internal_http_datatransfers_requests.AISTTRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Transcript
          schema:
            allOf:
            - $ref: '#/definitions/template_internal_http_handlers_v1.BaseResponse'
            - properties:
                data:
                  $ref: '#/definitions/template_internal_http_datatransfers_responses.AISTTResponse'
              type: object
        "400":
          description: Malformed JSON body
          schema:
            $ref: '#/definitions/template_internal_http_handlers_v1.BaseResponse'
        "401":
          description: Missing/invalid token
          schema:
            $ref: '#/definitions/template_internal_http_handlers_v1.BaseResponse'
        "422":
          description: Validation error
          schema:
            $ref: '#/definitions/template_internal_http_handlers_v1.BaseResponse'
        "429":
          description: Rate limit exceeded
          schema:
            $ref: '#/definitions/template_internal_http_handlers_v1.BaseResponse'
      security:
      - BearerAuth: []
      summary: Яриаг текст болгох (STT)
      tags:
      - ai
  /ai/translate:
    post:
      consumes:
      - application/json
      description: Текст эсвэл audio-г зорилтот хэл рүү орчуулна. Audio өгвөл эхлээд
        STT хийгээд орчуулдаг; speak=true бол орчуулгын дуут (TTS) хувилбарыг хамт
        буцаана. Live орчуулга = богино audio chunk-уудыг энэ endpoint руу дараалан
        илгээх урсгал. Чимээгүй chunk-д хоосон үр дүн буцаана.
      parameters:
      - description: Text or audio + target_lang
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/template_internal_http_datatransfers_requests.AITranslateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Translation
          schema:
            allOf:
            - $ref: '#/definitions/template_internal_http_handlers_v1.BaseResponse'
            - properties:
                data:
                  $ref: '#/definitions/template_internal_http_datatransfers_responses.AITranslateResponse'
              type: object
        "400":
          description: Malformed JSON body / missing text and audio
          schema:
            $ref: '#/definitions/template_internal_http_handlers_v1.BaseResponse'
        "401":
          description: Missing/invalid token
          schema:
            $ref: '#/definitions/template_internal_http_handlers_v1.BaseResponse'
        "422":
          description: Validation error
          schema:
            $ref: '#/definitions/template_internal_http_handlers_v1.BaseResponse'
        "429":
          description: Rate limit exceeded
          schema:
            $ref: '#/definitions/template_internal_http_handlers_v1.BaseResponse'
      security:
      - BearerAuth: []
      summary: Шууд (live) орчуулга
      tags:
      - ai
  /ai/tts:
    post:
      consumes:
      - application/json
      description: 'Текстийг Gemini TTS model-ээр дуут (audio/wav, base64) болгоно.
        voice нь сонголттой prebuilt дуу хоолой (өгөгдмөл: Kore).'
      parameters:
      - description: Text + optional voice
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/template_internal_http_datatransfers_requests.AITTSRequest'
      produces:
      - application/json
      responses:
        "200":
          description: WAV audio (base64)
          schema:
            allOf:
            - $ref: '#/definitions/template_internal_http_handlers_v1.BaseResponse'
            - properties:
                data:
                  $ref: '#/definitions/template_internal_http_datatransfers_responses.AIAudioOut'
              type: object
        "400":
          description: Malformed JSON body
          schema:
            $ref: '#/definitions/template_internal_http_handlers_v1.BaseResponse'
        "401":
          description: Missing/invalid token
          schema:
            $ref: '#/definitions/template_internal_http_handlers_v1.BaseResponse'
        "422":
          description: Validation error
          schema:
            $ref: '#/definitions/template_internal_http_handlers_v1.BaseResponse'
        "429":
          description: Rate limit exceeded
          schema:
            $ref: '#/definitions/template_internal_http_handlers_v1.BaseResponse'
      security:
      - BearerAuth: []
      summary: Текстийг яриа болгох (TTS)
      tags:
      - ai
  /auth/login:
    post:
      consumes:
      - application/json
      description: Access токен (богино TTL) болон refresh токен (урт TTL) буцаана.
        Хэрэглэгчийг тоолохоос сэргийлэхийн тулд буруу нууц үг болон тодорхойгүй email
        ижил хугацаа зарцуулна.
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/template_internal_http_datatransfers_requests.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Tokens issued
          schema:
            allOf:
            - $ref: '#/definitions/template_internal_http_handlers_v1.BaseResponse'
            - properties:
                data:
                  $ref: '#/definitions/template_internal_http_datatransfers_responses.UserResponse'
              type: object
        "400":
          description: Malformed JSON body
          schema:
            $ref: '#/definitions/template_internal_http_handlers_v1.BaseResponse'
        "401":
          description: Invalid email or password
          schema:
            $ref: '#/definitions/template_internal_http_handlers_v1.BaseResponse'
        "403":
          description: Account not yet activated
          schema:
            $ref: '#/definitions/template_internal_http_handlers_v1.BaseResponse'
        "422":
          description: Validation error
          schema:
            $ref: '#/definitions/template_internal_http_handlers_v1.BaseResponse'
      summary: Баталгаажуулж токен хос олгох
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: /auth/refresh татгалзахын тулд refresh-токены jti-г Redis-ээс устгана.
        access_token өгөгдсөн бол түүний jti-г deny-list-д нэмж access токеныг ч мөн
        шууд хүчингүй болгоно (өгөөгүй бол байгалийн хугацаа дуустлаа хүчинтэй үлдэнэ).
      parameters:
      - description: Refresh token to revoke + optional access token to deny
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/template_internal_http_datatransfers_requests.LogoutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Logged out
          schema:
            $ref: '#/definitions/template_internal_http_handlers_v1.BaseResponse'
        "401":
          description: Refresh token invalid
          schema:
            $ref: '#/definitions/template_internal_http_handlers_v1.BaseResponse'
        "422":
          description: Validation error
          schema:
            $ref: '#/definitions/template_internal_http_handlers_v1.BaseResponse'
      summary: Токенуудыг хүчингүй болгох
      tags:
      - auth
  /auth/password/change:
    put:
      consumes:
      - application/json
      description: Одоогийн нууц үгийг шалгаж, шинээр сольж, цуцлалтын хязгаарыг тэмдэглэдэг
        тул одооноос өмнө олгогдсон refresh токенууд татгалзагдана.
      parameters:
      - description: Current + new password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/template_internal_http_datatransfers_requests.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Password changed
          schema:
            $ref: '#/definitions/template_internal_http_handlers_v1.BaseResponse'
        "400":
          description: Malformed JSON body
          schema:
            $ref: '#/definitions/template_internal_http_handlers_v1.BaseResponse'
        "401":
          description: Current password incorrect
          schema:
            $ref: '#/definitions/template_internal_http_handlers_v1.BaseResponse'
        "422":
          description: Validation error
          schema:
            $ref: '#/definitions/template_internal_http_handlers_v1.BaseResponse'
      security:
      - BearerAuth: []
      summary: Баталгаажуулагдсан хэрэглэгчийн нууц үгийг солих
      tags:
      - auth
  /auth/password/forgot:
    post:
      consumes:
      - application/json
      description: Хаяг руу нэг удаагийн OTP кодыг (GeregeCloud Verify) и-мэйлээр
        илгээнэ. Хэрэглэгчийг тоолохоос сэргийлэхийн тулд email бүртгэлгүй байсан
        ч үргэлж 200 буцаана.
      parameters:
      - description: Email address
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/template_internal_http_datatransfers_requests.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Reset email queued (or email not registered — same response
            either way)
          schema:
            $ref: '#/definitions/template_internal_http_handlers_v1.BaseResponse'
        "400":
          description: Malformed JSON body
          schema:
            $ref: '#/definitions/template_internal_http_handlers_v1.BaseResponse'
        "422":
          description: Validation error
          schema:
            $ref: '#/definitions/template_internal_http_handlers_v1.BaseResponse'
      summary: Нууц үг сэргээх OTP код илгээх
      tags:
      - auth
  /auth/password/reset:
    post:
      consumes:
      - application/json
      description: ForgotPassword-ийн email-ээр илгээсэн OTP кодыг GeregeCloud Verify-ээр
        баталгаажуулж, шинэ нууц үг тогтоож, токены цуцлалтын хязгаарыг урагшлуулна.
      parameters:
      - description: Email + OTP code + new password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/template_internal_http_datatransfers_requests.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Password reset
          schema:
            $ref: '#/definitions/template_internal_http_handlers_v1.BaseResponse'
        "400":
          description: Malformed JSON body
          schema:
            $ref: '#/definitions/template_internal_http_handlers_v1.BaseResponse'
        "401":
          description: Reset code invalid or expired
          schema:
            $ref: '#/definitions/template_internal_http_handlers_v1.BaseResponse'
        "422":
          description: Validation error
          schema:
            $ref: '#/definitions/template_internal_http_handlers_v1.BaseResponse'
      summary: OTP кодоор шинэ нууц үг тогтоох
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Өгөгдсөн refresh токеныг шалгаж, шинэ access+refresh хос үүсгэж,
        хуучин jti-г Redis-д хүчингүй болгоно. Аль хэдийн сэлгэгдсэн токеныг дахин
        тоглуулах нь 401 буцаана.
      parameters:
      - description: Refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/template_internal_http_datatransfers_requests.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: New token pair
          schema:
            allOf:
            - $ref: '#/definitions/template_internal_http_handlers_v1.BaseResponse'
            - properties:
                data:
                  $ref: '#/definitions/template_internal_http_datatransfers_responses.UserResponse'
              type: object
        "401":
          description: Refresh token invalid, expired, or already revoked
          schema:
            $ref: '#/definitions/template_internal_http_handlers_v1.BaseResponse'
        "403":
          description: Account no longer active
          schema:
            $ref: '#/definitions/template_internal_http_handlers_v1.BaseResponse'
        "422":
          description: Validation error
          schema:
            $ref: '#/definitions/template_internal_http_handlers_v1.BaseResponse'
      summary: Refresh токеныг сэлгэж, шинэ хос буцаах
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Хэрэглэгчийн бүртгэлийг идэвхгүй төлөвт үүсгэнэ. Дуудагч нь /auth/login
        амжилттай болохоос өмнө бүртгэлийг идэвхжүүлэхийн тулд /auth/send-otp + /auth/verify-otp-г
        дагах ёстой.
      parameters:
      - description: Registration payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/template_internal_http_datatransfers_requests.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: User created
          schema:
            allOf:
            - $ref: '#/definitions/template_internal_http_handlers_v1.BaseResponse'
            - properties:
                data:
                  $ref: '#/definitions/template_internal_http_datatransfers_responses.UserResponse'
              type: object
        "400":
          description: Malformed JSON body
          schema:
            $ref: '#/definitions/template_internal_http_handlers_v1.BaseResponse'
        "409":
          description: Email or username already in use
          schema:
            $ref: '#/definitions/template_internal_http_handlers_v1.BaseResponse'
        "422":
          description: Validation error (per-field detail in data.errors)
          schema:
            $ref: '#/definitions/template_internal_http_handlers_v1.BaseResponse'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/template_internal_http_handlers_v1.BaseResponse'
      summary: Шинэ хэрэглэгч бүртгэх
      tags:
      - auth
  /auth/send-otp:
    post:
      consumes:
      - application/json
      description: GeregeCloud Verify API-аар OTP илгээж, буцаасан request_id-г TTL-тэйгээр
        Redis-д хадгална. Кодын үүсгэлт/хадгалалт/илгээлтийг Verify үйлчилгээ хариуцна.
      parameters:
      - description: Email to send OTP to
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/template_internal_http_datatransfers_requests.SendOTPRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OTP enqueued
          schema:
            $ref: '#/definitions/template_internal_http_handlers_v1.BaseResponse'
        "400":
          description: Account already activated
          schema:
            $ref: '#/definitions/template_internal_http_handlers_v1.BaseResponse'
        "404":
          description: Email not registered
          schema:
            $ref: '#/definitions/template_internal_http_handlers_v1.BaseResponse'
        "422":
          description: Validation error
          schema:
            $ref: '#/definitions/template_internal_http_handlers_v1.BaseResponse'
        "500":
          description: Failed to enqueue mail
          schema:
            $ref: '#/definitions/template_internal_http_handlers_v1.BaseResponse'
      summary: Хэрэглэгчийн email рүү OTP код илгээх
      tags:
      - auth
  /auth/verify-otp:
    post:
      consumes:
      - application/json
      description: Өгөгдсөн кодыг Redis-тэй тулгаж шалгаж, амжилттай үед хэрэглэгчийн
        active flag-г true болгоно. Brute-force-оос хамгаалагдсан — OTP_MAX_ATTEMPTS
        алдаа (өгөгдмөл 5) гарсны дараа зөв кодтой ч email нь OTP TTL цонхны турш
        түгжигдэнэ.
      parameters:
      - description: Email + OTP code
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/template_internal_http_datatransfers_requests.VerifyOTPRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Account activated
          schema:
            $ref: '#/definitions/template_internal_http_handlers_v1.BaseResponse'
        "400":
          description: Invalid OTP code
          schema:
            $ref: '#/definitions/template_internal_http_handlers_v1.BaseResponse'
        "403":
          description: Locked out — too many invalid attempts
          schema:
            $ref: '#/definitions/template_internal_http_handlers_v1.BaseResponse'
        "404":
          description: Email not registered
          schema:
            $ref: '#/definitions/template_internal_http_handlers_v1.BaseResponse'
        "422":
          description: Validation error
          schema:
            $ref: '#/definitions/template_internal_http_handlers_v1.BaseResponse'
      summary: OTP кодыг шалгаж бүртгэлийг идэвхжүүлэх
      tags:
      - auth
  /users/me:
    get:
      description: Authorization header дахь JWT-ээс баталгаажуулагдсан хэрэглэгчийг
        уншиж, тохирох бичлэгийг буцаана (эхлээд in-memory кэш, олдоогүй үед Postgres).
      produces:
      - application/json
      responses:
        "200":
          description: User profile
          schema:
            allOf:
            - $ref: '#/definitions/template_internal_http_handlers_v1.BaseResponse'
            - properties:
                data:
                  $ref: '#/definitions/template_internal_http_datatransfers_responses.UserResponse'
              type: object
        "401":
          description: Missing or invalid token
          schema:
            $ref: '#/definitions/template_internal_http_handlers_v1.BaseResponse'
        "404":
          description: User no longer exists
          schema:
            $ref: '#/definitions/template_internal_http_handlers_v1.BaseResponse'
      security:
      - BearerAuth: []
      summary: Одоогийн хэрэглэгчийн профайлыг буцаах
      tags:
      - users
schemes:
- http
- https
securityDefinitions:
  BearerAuth:
    description: /auth/login эсвэл /auth/refresh-аас олгогдсон Bearer хандах токен
      (access token).
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
