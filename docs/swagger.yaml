      - BearerAuth: []
      summary: Бүртгэлийн дугаараар хайх
      tags:
      - organizations
  /v1/security/events:
    get:
      description: RASP-style security event-үүдийг хуудаслан буцаана. Зөвхөн admin.
      parameters:
      - description: хуудасны хэмжээ (default 50, max 200)
        in: query
        name: limit
        type: integer
      - description: эхлэх байрлал (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Security events
          schema:
            allOf:
            - $ref: '#/definitions/template_internal_http_handlers_v1.BaseResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/template_internal_http_datatransfers_responses.SecurityEventResponse'
                  type: array
              type: object
        "401":
          description: Missing or invalid token
          schema:
            $ref: '#/definitions/template_internal_http_handlers_v1.BaseResponse'
        "403":
          description: Not an admin
          schema:
            $ref: '#/definitions/template_internal_http_handlers_v1.BaseResponse'
      security:
      - BearerAuth: []
      summary: Security event жагсаах (admin)
      tags:
      - security
    post:
      consumes:
      - application/json
      description: Нэвтэрсэн хэрэглэгч RASP-style security event илгээнэ (jailbreak,
        integrity, anomaly г.м.). Клиентийн IP + user-agent-г сервер тэмдэглэнэ. Хэрэглэгч
        зөвхөн өөрийнхөө тухай event илгээнэ.
      parameters:
      - description: Security event
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/template_internal_http_datatransfers_requests.IngestSecurityEventRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Event recorded
          schema:
            $ref: '#/definitions/template_internal_http_handlers_v1.BaseResponse'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/template_internal_http_handlers_v1.BaseResponse'
        "401":
          description: Missing or invalid token
          schema:
            $ref: '#/definitions/template_internal_http_handlers_v1.BaseResponse'
      security:
      - BearerAuth: []
      summary: Security event илгээх
      tags:
      - security
schemes:
- http
- https
securityDefinitions:
  BearerAuth:
    description: /auth/login эсвэл /auth/refresh-аас олгогдсон Bearer хандах токен
      (access token).
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
