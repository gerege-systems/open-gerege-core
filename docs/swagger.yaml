              type: object
        "401":
          description: Missing or invalid token
          schema:
            $ref: '#/definitions/template_internal_http_handlers_v1.BaseResponse'
        "404":
          description: Organization not found
          schema:
            $ref: '#/definitions/template_internal_http_handlers_v1.BaseResponse'
