      - application/json
      description: Гишүүний дүрийг (owner/admin/member) солино; дуудагч owner/admin
        байх ёстой.
      parameters:
      - description: Байгууллагын ID (uuid)
        in: path
        name: id
        required: true
        type: string
      - description: Гишүүн хэрэглэгчийн ID (uuid)
        in: path
        name: userID
        required: true
        type: string
      - description: Шинэ дүр
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/template_internal_http_datatransfers_requests.UpdateMemberRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Role updated
          schema:
            $ref: '#/definitions/template_internal_http_handlers_v1.BaseResponse'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/template_internal_http_handlers_v1.BaseResponse'
        "401":
          description: Missing or invalid token
          schema:
            $ref: '#/definitions/template_internal_http_handlers_v1.BaseResponse'
        "403":
          description: Not allowed to manage members
          schema:
            $ref: '#/definitions/template_internal_http_handlers_v1.BaseResponse'
        "404":
          description: Membership not found
          schema:
            $ref: '#/definitions/template_internal_http_handlers_v1.BaseResponse'
