# Dependabot — `platform-core`-ийн өөрийн хамаарлууд.
#
# Энэ модулийг 12 апп хамааралаар авдаг тул ЭНД орсон эмзэг байдал бүх
# платформд тархана. Иймд өдөр бүр шалгана.
#
# Merge нь АВТОМАТ БИШ: суурьт орсон өөрчлөлт шинэ tag болж, тэндээс аппууд
# руу дамждаг тул хүн шалгана.

version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels: [dependencies]
    groups:
      # Minor/patch-ыг нэг PR болгоно; major нь тусдаа ирж анхаарал татна.
      go-deps:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(ci)"
    labels: [dependencies, ci]
    groups:
      actions:
        patterns: ["*"]
